name: Türksat EPG Güncelle

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-epg:

    runs-on: ubuntu-latest

    steps:

      - name: Repository indir
        uses: actions/checkout@v4

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: EPG oluştur
        run: |
          python generate_epg.py

      - name: EPG dosyasını GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add epg.xml

          if git diff --cached --quiet; then
            echo "EPG değişmemiş."
          else
            git commit -m "EPG güncellendi"
            git push
          fi
