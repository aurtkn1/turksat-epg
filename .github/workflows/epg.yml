import json
import urllib.request
from datetime import datetime, timedelta
from xml.etree.ElementTree import Element, SubElement, ElementTree


# ============================================================
# TÜRKSAT KABLOTV EPG
# ============================================================

BASE_URL = "https://www.turksatkablo.com.tr/userUpload/EPG/{}.json"

OUTPUT_FILE = "epg.xml"

USER_AGENT = (
    "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
    "AppleWebKit/537.36 (KHTML, like Gecko) "
    "Chrome/151.0 Safari/537.36"
)


# ============================================================
# TÜRKSAT JSON DOSYASINI İNDİR
# ============================================================

def download_json(day):
    url = BASE_URL.format(day)

    request = urllib.request.Request(
        url,
        headers={
            "User-Agent": USER_AGENT,
            "Accept": "application/json,text/plain,*/*",
            "Referer": "https://www.turksatkablo.com.tr/",
        },
    )

    print("İndiriliyor:", url)

    with urllib.request.urlopen(request, timeout=60) as response:
        content = response.read().decode("utf-8")

    return json.loads(content)


# ============================================================
# XMLTV TARİH FORMATINA ÇEVİR
# ============================================================

def xmltv_time(dt):
    return dt.strftime("%Y%m%d%H%M%S +0000")


# ============================================================
# TÜRKSAT SAATİNİ UTC'YE ÇEVİR
# Türkiye UTC+3 olduğu için 3 saat çıkarıyoruz.
# ============================================================

def parse_time(base_date, time_string):
    hour, minute = map(int, time_string.split(":"))

    local_time = datetime(
        base_date.year,
        base_date.month,
        base_date.day,
        hour,
        minute,
        0,
    )

    return local_time - timedelta(hours=3)


# ============================================================
# PROGRAM XML'İ OLUŞTUR
# ============================================================

def create_program(channel_id, title, start, stop):

    programme = Element(
        "programme",
        {
            "start": xmltv_time(start),
            "stop": xmltv_time(stop),
            "channel": channel_id,
        },
    )

    title_element = SubElement(
        programme,
        "title",
        {
            "lang": "tr"
        },
    )

    title_element.text = title if title else "-"

    return programme


# ============================================================
# ANA İŞLEM
# ============================================================

def main():

    today = datetime.now()

    # Bugünün ve yarının EPG'sini alıyoruz.
    dates = [
        today,
        today + timedelta(days=1),
    ]

    all_data = []

    # --------------------------------------------------------
    # JSON DOSYALARINI İNDİR
    # --------------------------------------------------------

    for date in dates:

        day = date.strftime("%d")

        try:

            data = download_json(day)

            all_data.append(
                (
                    date,
                    data
                )
            )

            print(
                day,
                ".json başarıyla alındı."
            )

        except Exception as error:

            print(
                day,
                ".json alınamadı:",
                error
            )

    # Hiç veri alınamadıysa işlemi durdur.
    if not all_data:

        raise RuntimeError(
            "Türksat EPG verisi alınamadı."
        )


    # --------------------------------------------------------
    # XMLTV ANA ETİKETİ
    # --------------------------------------------------------

    tv = Element(
        "tv",
        {
            "generator-info-name": "Türksat KabloTV GitHub EPG",
            "generator-info-url": "https://www.turksatkablo.com.tr/",
        },
    )


    # --------------------------------------------------------
    # KANALLARI TUTACAĞIMIZ SÖZLÜK
    # --------------------------------------------------------

    channels = {}


    # ========================================================
    # KANALLARI OLUŞTUR
    # ========================================================

    for base_date, data in all_data:

        if not isinstance(data, dict):
            continue

        items = data.get("k", [])

        if not isinstance(items, list):
            continue

        for item in items:

            if not isinstance(item, dict):
                continue

            internal_id = item.get("i")
            name = item.get("n", "")

            if internal_id is None:
                continue

            if not name:
                continue

            internal_id = str(internal_id)


            # Aynı kanal iki farklı günde tekrar
            # gelirse ikinci kez oluşturma.
            if internal_id in channels:
                continue


            # Şimdilik mevcut JSON'daki "i" değerini
            # kanal ID'sinin temelinde kullanıyoruz.
            channel_id = (
                "turksatkablo-"
                + internal_id
            )


            channels[internal_id] = {
                "id": channel_id,
                "name": name,
            }


            # ------------------------------------------------
            # <channel>
            # ------------------------------------------------

            channel = SubElement(
                tv,
                "channel",
                {
                    "id": channel_id
                },
            )


            # ------------------------------------------------
            # <display-name>
            # ------------------------------------------------

            display_name = SubElement(
                channel,
                "display-name",
                {
                    "lang": "tr"
                },
            )

            display_name.text = name


    # ========================================================
    # PROGRAMLARI OLUŞTUR
    # ========================================================

    for base_date, data in all_data:

        if not isinstance(data, dict):
            continue

        items = data.get("k", [])

        if not isinstance(items, list):
            continue


        for item in items:

            if not isinstance(item, dict):
                continue

            internal_id = item.get("i")

            if internal_id is None:
                continue

            internal_id = str(internal_id)


            # Kanal oluşturulmamışsa geç.
            if internal_id not in channels:
                continue


            programs = item.get("p", [])

            if not isinstance(programs, list):
                continue


            previous_start = None


            # ------------------------------------------------
            # KANAL PROGRAMLARI
            # ------------------------------------------------

            for program in programs:

                if not isinstance(program, dict):
                    continue


                title = program.get(
                    "b",
                    "-"
                )

                start_text = program.get(
                    "c"
                )

                stop_text = program.get(
                    "d"
                )


                if not start_text:
                    continue

                if not stop_text:
                    continue


                # ------------------------------------------------
                # BAŞLANGIÇ / BİTİŞ SAATLERİ
                # ------------------------------------------------

                try:

                    start = parse_time(
                        base_date,
                        start_text
                    )

                    stop = parse_time(
                        base_date,
                        stop_text
                    )

                except Exception:

                    continue


                # ------------------------------------------------
                # GECE YARISINI GEÇEN PROGRAM
                # Örneğin:
                #
                # 22:00 - 01:00
                #
                # ------------------------------------------------

                if stop <= start:

                    stop += timedelta(
                        days=1
                    )


                # ------------------------------------------------
                # SAAT SIRASI KONTROLÜ
                # ------------------------------------------------

                if (
                    previous_start is not None
                    and start < previous_start
                ):

                    start += timedelta(
                        days=1
                    )


                    if stop <= start:

                        stop += timedelta(
                            days=1
                        )


                previous_start = start


                # ------------------------------------------------
                # PROGRAM XML'İ
                # ------------------------------------------------

                programme = create_program(
                    channels[internal_id]["id"],
                    title,
                    start,
                    stop,
                )


                tv.append(
                    programme
                )


    # ========================================================
    # XML DOSYASINI KAYDET
    # ========================================================

    tree = ElementTree(tv)


    # Python sürümü destekliyorsa XML'i okunabilir biçime getir.
    try:

        import xml.etree.ElementTree as ET

        ET.indent(
            tree,
            space="  "
        )

    except Exception:

        pass


    tree.write(
        OUTPUT_FILE,
        encoding="utf-8",
        xml_declaration=True,
    )


    # ========================================================
    # SONUÇ
    # ========================================================

    print()
    print(
        "========================================"
    )

    print(
        "EPG başarıyla oluşturuldu."
    )

    print(
        "Dosya:",
        OUTPUT_FILE
    )

    print(
        "Kanal sayısı:",
        len(channels)
    )

    print(
        "========================================"
    )


# ============================================================
# PROGRAMI ÇALIŞTIR
# ============================================================

if __name__ == "__main__":
    main()
